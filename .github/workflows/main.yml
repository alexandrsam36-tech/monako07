
name: Build HP USB Print APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 --retry-all-errors \
            -o gradle.zip \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Find project
        run: |
          PROJECT="."

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP_FILE=$(find . -maxdepth 4 -type f -iname "*.zip" | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              mkdir -p "$RUNNER_TEMP/hp_project"
              unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/hp_project"
              PROJECT="$RUNNER_TEMP/hp_project"
            fi
          fi

          SETTINGS=$(find "$PROJECT" -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            find . -maxdepth 5 -type f
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Fix Kotlin layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/example/hpusbprintdiagnostic/MainActivity.kt")
          s = p.read_text(encoding="utf-8")

          old = """            addView(ScrollView(this@MainActivity).apply {
                          addView(output)
                      }, LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)"""

          new = """            addView(ScrollView(this@MainActivity).apply {
                          addView(output)
                      }, LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      ))"""

          if old not in s:
              print("Checking alternate layout formatting...")
              import re
              pattern = r'addView\(ScrollView\(this@MainActivity\)\.apply\s*\{\s*addView\(output\)\s*\},\s*LinearLayout\.LayoutParams\.MATCH_PARENT,\s*0,\s*1f\)'
              s, count = re.subn(
                  pattern,
                  'addView(ScrollView(this@MainActivity).apply { addView(output) }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))',
                  s,
                  count=1
              )
              if count == 0:
                  raise SystemExit("ERROR: Could not locate incorrect addView code")

          else:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          print("Kotlin layout successfully corrected")
          PY
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Fix JVM compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          if "sourceCompatibility" not in s:
              s = s.replace(
                  "    defaultConfig {",
                  """    compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }

                  kotlinOptions {
                      jvmTarget = "17"
                  }

                  defaultConfig {"""
              )

          p.write_text(s, encoding="utf-8")
          print("JVM compatibility configured")
          PY
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build APK
        run: gradle assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HP-USB-Print-Diagnostic
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
