
name: Build HP USB Print APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 --retry-all-errors \
            -o gradle.zip \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Find and prepare project
        run: |
          PROJECT="."

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              mkdir -p "$RUNNER_TEMP/hp_project"
              unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/hp_project"
              PROJECT="$RUNNER_TEMP/hp_project"
            fi
          fi

          SETTINGS=$(find "$PROJECT" -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found!"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

            - name: Fix JVM compatibility
        run: |
          cat > "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.hpusbprintdiagnostic"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.hpusbprintdiagnostic"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HP-USB-Print-Diagnostic
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

